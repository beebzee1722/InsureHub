[project]
name = "insurehub"
version = "0.1.0"
description = "Insurance underwriting application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
